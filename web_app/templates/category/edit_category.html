{% extends "base.html" %}

{% block title %}Edit Category{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Category</h2>
    <hr>

    <form method="POST">
        <!-- Category Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Category Name</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ category.name }}"
                required
            >
            <label class="form-label mt-3">Monthly Budget (£)</label>
            <input
                type="number"
                step="0.01"
                id="budget_amount"
                name="budget_amount"
                class="form-control"
                value="{{ category.budget_amount }}"
            >
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{{ url_for('category.category') }}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
