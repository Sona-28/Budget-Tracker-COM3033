{% extends "base.html" %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title is-2">Edit Category</h1>

        <form method="POST" class="box">
            <!-- Category Name -->
            <div class="field">
                <label for="name" class="label">Category Name</label>
                <div class="control">
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="input"
                        value="{{ category.name }}"
                        required
                    >
                </div>
            </div>

            <!-- Monthly Budget -->
            <div class="field">
                <label for="budget_amount" class="label">Monthly Budget (£)</label>
                <div class="control">
                    <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        id="budget_amount"
                        name="budget_amount"
                        class="input"
                        value="{{ category.budget_amount }}"
                    >
                </div>
            </div>

            <!-- Buttons -->
            <div class="field">
                <div class="control">
                    <button type="submit" class="button is-primary">
                        Save Changes
                    </button>
                    <a href="{{ url_for('category.category') }}"
                       class="button is-light ml-2">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</section>
{% endblock %}
