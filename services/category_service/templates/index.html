{% extends "base.html" %}
{% block content %}

<h2>Categories</h2>

<div class="category-list">
    <form method="POST" action="{{ url_for('add_category') }}">
        <input type="text" name="name" placeholder="New Category" required>
        <input type="number" step="0.01" name="budget_amount" placeholder="Budget Amount">
        <input type="submit" value="Add">
    </form>

    <ul>
        {% for category in categories %}
        <li>
            <strong>{{ category.name }}</strong>
            {% if category.budget_amount %}
                — Budget: £{{ "%.2f"|format(category.budget_amount) }}
            {% else %}
                — Budget: Not set
            {% endif %}
            — <a href="{{ url_for('edit_category', id=category.id) }}">Edit</a>
            — <a href="{{ url_for('delete_category', id=category.id) }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
